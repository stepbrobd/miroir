name: Tag

on:
  push:
    branches: [master]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < version.txt)"
          commit="$(git log -1 --format=%H -- version.txt)"
          if gh api "repos/${GH_REPO}/git/ref/tags/${version}" > /dev/null 2>&1; then
            echo "tag ${version} exists, nothing to do"
            exit 0
          fi
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${version}" -f sha="${commit}"
